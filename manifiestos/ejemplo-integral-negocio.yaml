cliente: "[cliente]"
paquete: integral
acompanamiento: integral   # tecnico = explica el cómo y el porqué | integral = resultados simples, sin tecnicismo
agente:
  nombre: "[nombre con el que el cliente se dirige a su agente]"
  personalidad: "[texto libre corto, ej. 'cálido, directo, sin jerga técnica']"
vault: ~/Documents/Obsidian/Bóveda-cliente
ritmo:                       # opcional · ver bootstrap/ORGANIZACION-TEMPORAL.md
  inicio_profundo: "[hora en que arranca el trabajo profundo]"
  bloque_min: [37, 50]        # rango; la persona decide en el momento
  pausa_min: [7, 10]
  activacion_min: 60          # ritual AM: movimiento + desayuno con journaling
  dias_innegociables: [lu, ma, mi, ju, vi]
  innegociables:              # eventos recurrentes; las tareas se acomodan alrededor
    almuerzo: "[hh:mm-hh:mm]"
    ritual_pm: "[hh:mm-hh:mm]"     # cierre + ÚNICA tarea de mañana + historia del día
    revision_semanal: "[día y hora; puede ser el primer bloque profundo]"
  franja_operativa: "[desde qué hora va lo operativo y creativo]"
  avisos_en_ventana: solo-accion   # solo-accion | normal; lo informativo va en un resumen al cerrar la ventana
  mover_sin_energia: preguntar     # preguntar | automatico
modulos:
  - {id: A1, escala: 2}
  - {id: A2, escala: 2}
  - {id: A3, escala: 2}
  - {id: A5, escala: 2}
  - {id: B2, escala: 2}
  - {id: C1, escala: 2}
  - {id: C2, escala: 2}
  - {id: E1, escala: 2}
  - {id: E3, escala: 2}
herramientas: {modo: asignar, perfil: auto, ya_usa: [], extras: [], excluir: [], cuentas: [telegram, whatsapp-business, google-drive]}
