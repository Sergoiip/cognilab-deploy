version_catalogo: 0.12.0
_nota: 'Todo es opcional y gratis. Los perfiles son SUGERENCIAS: el instalador pregunta
  qué instalar. Para ampliar sin tocar este archivo, usar stack/extras.yaml. Plugins:
  se verifican por sha256 (release oficial, o la carpeta vendor del repo para el fork
  de Cadence).'
apps:
  hermes:
    nombre: Hermes Agent
    tipo: hermes
    costo: gratis
    url: https://hermes-agent.nousresearch.com/install.sh
    para: agente de IA
    opcional: true
  obsidian:
    nombre: Obsidian
    tipo: sistema
    bin: obsidian
    pm:
      pacman: obsidian
      apt: flatpak:md.obsidian.Obsidian
      dnf: flatpak:md.obsidian.Obsidian
    verificado:
    - pacman
    para: bóveda / second brain
    opcional: true
  git:
    nombre: Git
    tipo: sistema
    bin: git
    pm:
      pacman: git
      apt: git
      dnf: git
    verificado:
    - pacman
    para: versionar la bóveda
    opcional: true
  gh:
    nombre: GitHub CLI
    tipo: sistema
    bin: gh
    pm:
      pacman: github-cli
      apt: gh
      dnf: gh
    verificado:
    - pacman
    para: respaldo en GitHub
    opcional: true
  ffmpeg:
    nombre: FFmpeg
    tipo: sistema
    bin: ffmpeg
    pm:
      pacman: ffmpeg
      apt: ffmpeg
      dnf: ffmpeg-free
    verificado:
    - pacman
    para: audio y video
    opcional: true
  pandoc:
    nombre: Pandoc
    tipo: sistema
    bin: pandoc
    pm:
      pacman: pandoc-cli
      apt: pandoc
      dnf: pandoc
    verificado:
    - pacman
    para: documentos
    opcional: true
  syncthing:
    nombre: Syncthing
    tipo: sistema
    bin: syncthing
    pm:
      pacman: syncthing
      apt: syncthing
      dnf: syncthing
    verificado:
    - pacman
    para: sincronizar equipos sin nube
    opcional: true
  rclone:
    nombre: rclone
    tipo: sistema
    bin: rclone
    pm:
      pacman: rclone
      apt: rclone
      dnf: rclone
    verificado:
    - pacman
    para: espejo con Drive u otra nube
    opcional: true
  obs-studio:
    nombre: OBS Studio
    tipo: sistema
    bin: obs
    pm:
      pacman: obs-studio
      apt: obs-studio
    verificado:
    - pacman
    para: captura multipista
    opcional: true
  kdenlive:
    nombre: Kdenlive
    tipo: sistema
    bin: kdenlive
    pm:
      pacman: kdenlive
      apt: kdenlive
      dnf: kdenlive
    verificado:
    - pacman
    para: edición de video
    opcional: true
  inkscape:
    nombre: Inkscape
    tipo: sistema
    bin: inkscape
    pm:
      pacman: inkscape
      apt: inkscape
      dnf: inkscape
    verificado:
    - pacman
    para: logos y vectores
    opcional: true
  gimp:
    nombre: GIMP
    tipo: sistema
    bin: gimp
    pm:
      pacman: gimp
      apt: gimp
      dnf: gimp
    verificado:
    - pacman
    para: retoque de fotos
    opcional: true
  libreoffice:
    nombre: LibreOffice
    tipo: sistema
    bin: libreoffice
    pm:
      pacman: libreoffice-fresh
      apt: libreoffice
      dnf: libreoffice
    verificado:
    - pacman
    para: cotizaciones y cuentas de cobro
    opcional: true
  faster-whisper:
    nombre: Transcripción local (faster-whisper)
    tipo: pip
    paquete: faster-whisper
    para: captura por voz
    opcional: true
  voxtype:
    nombre: Voxtype (dictado local push-to-talk)
    tipo: manual
    url: https://github.com/aisensiy/voxtype/releases/latest
    licencia: MIT
    para: captura por voz en cualquier app (Linux, Wayland o X11)
    opcional: true
    nota: 'Sin automatizar: no hay versión/sha256 fijados todavía para verificar la descarga (a diferencia de los plugins de Obsidian de este catálogo). Instalar a mano con el AppImage, .deb o .rpm del release, o AUR. Elegir motor/modelo según el hardware del cliente: pocos recursos (CPU sin GPU, <8GB RAM) -> Moonshine (modelo diminuto); equipo normal -> Whisper (el motor por defecto, 99 idiomas); CPU moderno con AVX-512 y se quiere máxima velocidad -> Parakeet (más pesado, solo inglés). Todo corre localmente, sin nube.'
  wispr-flow:
    nombre: Wispr Flow (dictado por voz)
    tipo: manual
    url: 'Mac Apple Silicon: https://dl.wisprflow.ai/mac-apple/latest · Mac Intel: https://dl.wisprflow.ai/mac-intel/latest · Windows: https://dl.wisprflow.ai/windows/latest'
    para: captura por voz en cualquier app (macOS, Windows)
    opcional: true
    nota: 'Solo Mac/Windows — este instalador no soporta esos sistemas (ver "Límites conocidos"), así que queda siempre como paso a mano. No es local: procesa el audio en la nube de Wispr. Gratis con límite de uso semanal/mensual (sin tarjeta); plan Pro de pago para uso ilimitado. Mencionar el límite al cliente antes de prometerlo como solución definitiva.'
  tasknotes:
    nombre: TaskNotes (plugin)
    tipo: obsidian-plugin
