perfiles:
  ligero:
    escala: 1
    descripcion: 'Individuo. Lo mínimo que funciona: bóveda + agente + respaldo.'
    apps:
    - hermes
    - obsidian
    - git
    - gh
    - obsidian-git
    - templater-obsidian
  negocio:
    escala: 2
    descripcion: 1 a 5 personas. Suma tareas, CRM y sincronización.
    hereda: ligero
    apps:
    - tasknotes
    - cadence-planner
    - syncthing
    - pandoc
    - ffmpeg
  equipo:
    escala: 3
    descripcion: Varios roles. Suma espejo en nube y mapas.
    hereda: negocio
    apps:
    - rclone
    - obsidian-excalidraw-plugin
