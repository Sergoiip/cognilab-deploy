      manifest.json: 7ad98e8cce157e9846b47941c6a7cb9b022bc9d5c6d11782290e7a7a164b470d
      styles.css: f30ad2ca42fefe3b704c548f7747d285c2038fa4ce90601e68fe6fd660494052
