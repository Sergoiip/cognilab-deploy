_nota: Todo es gratis. Los plugins se bajan del release oficial y se verifican por
  sha256 (no se redistribuyen aquí). 'verificado' = gestores donde confirmé el nombre
  del paquete.
apps:
  hermes:
    nombre: Hermes Agent
    tipo: hermes
    costo: gratis
    url: https://hermes-agent.nousresearch.com/install.sh
    para: agente de IA
  obsidian:
    nombre: Obsidian
    tipo: sistema
    bin: obsidian
    pm:
      pacman: obsidian
      apt: flatpak:md.obsidian.Obsidian
      dnf: flatpak:md.obsidian.Obsidian
    verificado:
    - pacman
    para: bóveda / second brain
  git:
    nombre: Git
    tipo: sistema
    bin: git
    pm:
      pacman: git
      apt: git
      dnf: git
    verificado:
    - pacman
    para: versionar la bóveda
  gh:
    nombre: GitHub CLI
    tipo: sistema
    bin: gh
    pm:
      pacman: github-cli
      apt: gh
      dnf: gh
    verificado:
    - pacman
    para: respaldo en GitHub
  ffmpeg:
    nombre: FFmpeg
    tipo: sistema
    bin: ffmpeg
    pm:
      pacman: ffmpeg
      apt: ffmpeg
      dnf: ffmpeg-free
    verificado:
    - pacman
    para: audio y video
  pandoc:
    nombre: Pandoc
    tipo: sistema
    bin: pandoc
    pm:
      pacman: pandoc-cli
      apt: pandoc
      dnf: pandoc
    verificado:
    - pacman
    para: documentos
  syncthing:
    nombre: Syncthing
    tipo: sistema
    bin: syncthing
    pm:
      pacman: syncthing
      apt: syncthing
      dnf: syncthing
    verificado:
    - pacman
    para: sincronizar equipos sin nube
  rclone:
    nombre: rclone
    tipo: sistema
    bin: rclone
    pm:
      pacman: rclone
      apt: rclone
      dnf: rclone
    verificado:
    - pacman
    para: espejo con Drive u otra nube
  obs-studio:
    nombre: OBS Studio
    tipo: sistema
    bin: obs
    pm:
      pacman: obs-studio
      apt: obs-studio
    verificado:
    - pacman
    para: captura multipista
  kdenlive:
    nombre: Kdenlive
    tipo: sistema
    bin: kdenlive
    pm:
      pacman: kdenlive
      apt: kdenlive
      dnf: kdenlive
    verificado:
    - pacman
    para: edición de video
  inkscape:
    nombre: Inkscape
    tipo: sistema
    bin: inkscape
    pm:
      pacman: inkscape
      apt: inkscape
      dnf: inkscape
    verificado:
    - pacman
    para: logos y vectores
  gimp:
    nombre: GIMP
    tipo: sistema
    bin: gimp
    pm:
      pacman: gimp
      apt: gimp
      dnf: gimp
    verificado:
    - pacman
    para: retoque de fotos
  libreoffice:
    nombre: LibreOffice
    tipo: sistema
    bin: libreoffice
    pm:
      pacman: libreoffice-fresh
      apt: libreoffice
      dnf: libreoffice
    verificado:
    - pacman
    para: cotizaciones y cuentas de cobro
  faster-whisper:
    nombre: Transcripción local (faster-whisper)
    tipo: pip
    paquete: faster-whisper
    para: captura por voz
  cadence-planner:
    nombre: cadence-planner
    tipo: obsidian-plugin
    repo: wesswart77/obsidian-cadence
    version: 0.15.0
    licencia: MIT
    sha256:
      main.js: 00a3a32ad9fde6b9c4ec59717c1d2ebf7a09570b00d4867d284ba4215c0aabab
      manifest.json: 0ca4e2cbf9f5fe14271deac227f067fcdc76435b4c232c6307d197310d1473d2
      styles.css: 0c9f9c39c83a146f8054291a175b7de59e9df81a0a38118000dbeae24e436fda
