id: consultor-e2
tipo_empresa: consultor-marca-personal
escala: 2
estado: piloto                   # borrador | piloto | validado (ver nucleo.yaml)
lentes: [pkm, apqc]              # dueño único: la persona y el negocio a la vez
estaciones:
  - tipo: negocio
    fusiona: persona             # por defecto lo personal se separa por carpetas, no por perfil
opcionales:
  - tipo: persona
    cuando: "Si el dueño quiere separar lo personal del negocio (memoria, canal y tablero propios). CogniLab lo hizo el 10-nov"
  - tipo: servicio
    cuando: "Si se abre atención pública automatizada"
naves_base:                      # ids del catálogo flota/naves/<sector>/<id>.yaml
  - aviso-cobros
  - estado-entregables
cobertura_minima:                # sectores que deben tener al menos un faro o nave activa
  - direccion
  - clientes
  - marca
  - operacion
  - finanzas
  - equipo
  - memoria
  - mantenimiento
evidencia: []                    # se llena al validar: cliente (anonimizado), ciclo, criterios cumplidos, indicador medido
