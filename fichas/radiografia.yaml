# Ficha estructurada de la Radiografía. Se copia a la carpeta del cliente (NO se versiona aquí con datos reales).
# Alimenta tools/plan.py y tools/roster_sugerido.py. Reemplaza en la práctica a fichas/ingreso.md (que sigue como guion de entrevista).
cliente: "[cliente]"
tipo: negocio              # negocio | proyecto
paquete_objetivo: integral # esencial | integral | piloto
vault: ~/Documents/Obsidian/Bóveda-cliente

personas:                  # quién toca el trabajo (roles, no nombres)
  - {rol: dueño, usa_pc: true}

# Identidad de la agencia/empresa de agentes que se va a construir con ellos — alimenta el
# "universo de agentes" (roster de Bots) y cómo se habla con el cliente del proyecto, no el
# look & feel de CogniLab. Texto libre, corto; no inventar nada que el cliente no haya dicho.
identidad_agentes:
  narrativa_lore: ""        # cómo se imaginan a su "equipo de agentes": nombre de la agencia/mundo, tono, metáfora que usan ellos mismos
  motivacion: ""             # qué los mueve de verdad en el negocio (no la misión de cartón: lo que SÍ les quita el sueño o los emociona)
  estetica_favorita: ""      # referencias visuales/de marca que ya les gustan (puede ser "ninguna preferencia")

# Componente humano de la persona principal (dueño/a u otro rol clave) — OPCIONAL y solo si hay
# confianza/tiempo real para preguntarlo; no es un cuestionario a rellenar por obligación. La
# persona sabe que esto se está preguntando y para qué (autorización de "Antes de empezar", día
# 0) — nunca inferir ni completar lo que no dijo. Vive bajo el mismo acuerdo que `datos_sensibles`.
perfil_humano:
  aplica: false              # true solo si de verdad se tuvo esta conversación
  miedos: ""
  ilusiones_y_sueños: ""
  metas: ""
  proyectos_personales: ""
  fracasos_pasados: ""       # como aprendizaje, no como juicio
  red_de_apoyo: ""           # con quién se rodea, quién lo sostiene
  relacion_con_su_trabajo: ""  # cómo se siente frente a lo que hace, no solo qué hace
  quiere_aprender: ""
  vision:
    3_meses: ""
    1_año: ""
    5_años: ""
  avenidas_creativas: ""     # otras cosas que quiere explorar o consolidar, aparte del negocio

# Dolores: máximo 5. Sin 3 evidencias no entra al plan.
# categoria: ver criterios/dolor-a-modulo.yaml
dolores:
  - id: D1
    categoria: archivos-desordenados
    descripcion: "Ejemplo: no encuentra la última cotización"
    prioridad: 3            # 1 baja · 3 alta
    evidencias: ["dicha: ...", "mostrada: ...", "mostrada: ..."]
    causa_raiz: ""

# Por módulo candidato: cuántas personas lo tocan y qué cuesta que falle (bajo | medio | alto)
uso_modulos: {}
# Ejemplo:
#   A2: {personas: 1, costo_falla: bajo}

herramientas_actuales:      # ids del catálogo que ya usa, o texto libre si no está en el catálogo
  ya_usa: []
  otras: []                 # ej. Notion, Excel
  modo: asignar             # cliente | asignar

cuentas_que_crea_el_cliente: []   # telegram, whatsapp-business, discord, google-drive

linea_base:                 # máx. 5
  - {indicador: "", valor: "", fecha: "", fuente: ""}

datos_sensibles: ""
portafolio_autorizado: false
